[project]
name = "dsa-tracer"
version = "0.1.0"
description = "GDB Python scripts for DSA code execution tracing"
requires-python = ">=3.10"
authors = [
    { name = "DSA Visualizer Team" }
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
