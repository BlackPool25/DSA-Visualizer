version: '3.8'

services:
  # React frontend development server
  # NOTE: Frontend is Phase 4 - uncomment when frontend/ directory exists
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: dsa-frontend
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   environment:
  #     - NODE_ENV=development
  #     - VITE_API_URL=http://localhost:4000
  #   depends_on:
  #     - backend
  #   networks:
  #     - dsa-network

  # Express API backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsa-backend
    ports:
      - "4000:4000"
    volumes:
      # Mount source code for hot reload
      - ./backend:/app
      # Persist node_modules
      - /app/node_modules
      # Shared types (read-only)
      - ./shared:/app/shared:ro
      # Docker socket for spawning executor containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared temp directory for code files (must be same path as host for Docker bind mounts)
      - /tmp/dsa-visualizer:/tmp/dsa-visualizer
    environment:
      - NODE_ENV=development
      - PORT=4000
      - EXECUTOR_IMAGE=dsa-executor:latest
      - TEMP_DIR=/tmp/dsa-visualizer
      - EXECUTOR_SERVICE_NAME=executor
      - EXECUTOR_NETWORK=dsa-network
    depends_on:
      - executor
    networks:
      - dsa-network

  # Sandboxed C++ execution environment
  # NOTE: This service is used to build the image. The backend spawns fresh containers dynamically.
  # SECURITY CRITICAL: This container runs untrusted user code
  executor:
    build:
      context: ./executor
      dockerfile: Dockerfile
    container_name: dsa-executor
    # This service just needs to exist for the image to be built
    # The backend spawns fresh containers for each execution
    command: ["echo", "Executor image built successfully"]

networks:
  dsa-network:
    driver: bridge
    name: dsa-network